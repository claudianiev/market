server:
  port: 8083
spring:
  application:
    name: ms-productos
  servlet:
    context-path: /productos

  datasource:
    url: jdbc:postgresql://localhost:5433/producto_db
    username: cnieves
    password: cnieves83
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers,circuitbreakerevents
  health:
    circuitbreakers:
      enabled: true
  tracing:
    sampling:
      probability: 1.0 # captura 100% de trazas
zipkin:
  tracing:
    endpoint: http://localhost:9411/api/v2/spans